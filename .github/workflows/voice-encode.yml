name: Encode and check the course narration

# Turns the PMITY Starter narration recorded on PMITY Voice (husayn-default, WAV) into the MP3 files the course page
# plays (cli-notes R9 in jrock9000/pmity-starter-courses), and transcribes each file to catch garbled or dropped words.
# Runs here, on GitHub's machine, so the media work stays off the IONOS cluster and the workstation.
#
# Input: asset <set>-voice-wav.tar on the DRAFT release named by `tag` (drafts are visible only to the repository's
# collaborators). Output: <set>-voice-mp3.tar (manifest.json + <key>.mp3) and a report on the same draft release:
# report.json for the Starter course (set=starter), lgs-report.json for Linux Getting Started (set=lgs). Nothing is published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag holding starter-voice-wav.tar"
        required: true
        type: string
      set:
        description: "Which narration: starter (the Starter course) or lgs (Linux Getting Started)"
        required: false
        default: starter
        type: choice
        options: [starter, lgs]

concurrency:
  group: voice-encode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      SET: ${{ inputs.set || 'starter' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (ffmpeg, faster-whisper, num2words)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q faster-whisper==1.2.1 num2words==0.5.14 numpy
      - name: Fetch the recording
        run: |
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true || { echo "::error::$TAG is not a draft release"; exit 1; }
          mkdir -p "$RUNNER_TEMP/in" && cd "$RUNNER_TEMP/in"
          gh release download "$TAG" -p "$SET-voice-wav.tar"
          tar -xf "$SET-voice-wav.tar" && rm "$SET-voice-wav.tar"
          find out -name "*.wav" | wc -l
      - name: Encode and transcribe
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I voice/encode.py "$RUNNER_TEMP/in" "$RUNNER_TEMP/mp3"
      - name: Attach the results to the draft release
        run: |
          cd "$RUNNER_TEMP/mp3"
          R=report.json; [ "$SET" = starter ] || R="$SET-report.json"
          cp report.json "$RUNNER_TEMP/$R"
          tar -cf "$RUNNER_TEMP/$SET-voice-mp3.tar" manifest.json ./*.mp3
          gh release upload "$TAG" "$RUNNER_TEMP/$SET-voice-mp3.tar" "$RUNNER_TEMP/$R" --clobber
