name: Build and publish the class VM

# Builds the PMITY Starter class VM (pmity-lab.ova) from scratch on GitHub's own build machine, boot-tests it, and
# publishes it here as a release that students can download (this repository is public; the course repository,
# jrock9000/pmity-starter-courses, is private).
#
# Inputs it needs, all in the course repository:
#   - main (or the ref given): course/, kit/, ova/build-ova.sh, ova/update-ova.sh, ova/test-ova.sh, course/assemble/make.py
#   - branches grafana-deb, kafka-tgz, firefox-deb: the large files the VM carries, in pieces with checksums
# Read with secret STARTER_COURSES_DEPLOY_KEY (a read-only deploy key on jrock9000/pmity-starter-courses; no expiry),
# written to the runner's temp folder and removed after the fetch. Nothing private is published: only the .ova pieces, its checksum and the two
# assemble scripts. The course source, workbook and instructor material stay in the course repository.
#
# Release tag: starter-vm-<first 12 of the .ova's SHA-256>. debootstrap installs the archive's packages of the day, so
# every build has a new checksum and a new tag; the newest release is marked latest, which is what the course page
# links to (https://github.com/jrock9000/pmity-starter-vm/releases/latest).

on:
  workflow_dispatch:
    inputs:
      course_ref:
        description: "Commit or branch of jrock9000/pmity-starter-courses to build from"
        required: false
        default: main
        type: string
      publish:
        description: "Publish the release (off: build and test only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: vm-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  COURSE_REPO: jrock9000/pmity-starter-courses
  W: /mnt/w

jobs:
  build:
    name: Build, boot-test and publish pmity-lab.ova
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Room to build (the image needs about 15 GB)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$W" && sudo chown "$USER" "$W"
          df -h / /mnt

      - name: Build tools (as ova/README.md lists)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q debootstrap qemu-utils qemu-system-x86 grub-pc-bin fdisk sshpass zip gpg
          # VirtualBox only writes and reads the .ova here (no VM runs in it); its kernel module may fail to build on this
          # machine's kernel, which VBoxManage export and import --dry-run do not need.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q virtualbox || true
          VBoxManage --version

      - name: Fetch the course and the large files
        id: course
        env:
          DEPLOY_KEY: ${{ secrets.STARTER_COURSES_DEPLOY_KEY }}
          REF: ${{ inputs.course_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::secret STARTER_COURSES_DEPLOY_KEY is not set"; exit 1; fi
          # Read-only deploy key of the course repository: one repository, read only, no expiry. Lives only in RUNNER_TEMP.
          k="$RUNNER_TEMP/course-key"; (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$k")
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $k -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          git clone --quiet --no-checkout --filter=blob:none "git@github.com:${COURSE_REPO}.git" "$W/course"
          cd "$W/course"
          git fetch --quiet origin "$REF"
          git checkout --quiet FETCH_HEAD
          sha=$(git rev-parse HEAD)
          for b in grafana-deb kafka-tgz firefox-deb; do
            git fetch --quiet --depth 1 origin "refs/heads/$b:refs/remotes/origin/$b"
            mkdir -p "$W/files/$b"
            git archive "refs/remotes/origin/$b" | tar -x -C "$W/files/$b"
          done
          rm -f "$k"
          { echo "sha=$sha"; echo "short=${sha:0:7}"; } >> "$GITHUB_OUTPUT"
          echo "course commit $sha"

      - name: Join and check the large files, put them in ova/extras
        run: |
          set -euo pipefail
          X="$W/course/ova/extras"; mkdir -p "$X"
          join() { (cd "$W/files/$1" && cat "$2".part-* > "$X/$2" && cd "$X" && sha256sum -c "$W/files/$1/$3"); }
          join grafana-deb grafana-enterprise_13.3.0_40412481033_linux_amd64.deb grafana.sha256
          join kafka-tgz kafka_2.13-4.1.0.tgz kafka.sha256
          (cd "$X" && sha512sum -c "$W/files/kafka-tgz/kafka.sha512")
          join firefox-deb 'firefox_160.0~build1_amd64.deb' firefox.sha256
          cp "$W/files/firefox-deb/mozilla-repo-signing-key.asc" "$X/"
          fpr=$(gpg --show-keys --with-colons "$X/mozilla-repo-signing-key.asc" | awk -F: '/^fpr/{print $10; exit}')
          [ "$fpr" = 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3 ] || { echo "::error::not Mozilla's repository key: $fpr"; exit 1; }
          ls -l "$X"

      - name: Course pages and kit the VM carries (course/package.sh, without the VM)
        run: cd "$W/course/course" && NO_OVA=1 ./package.sh

      - name: Build the VM (ova/build-ova.sh, then ova/update-ova.sh as release.sh does)
        run: |
          set -euo pipefail
          cd "$W/course/ova"
          sudo ./build-ova.sh
          sudo ./update-ova.sh
          ls -l out/

      - name: Boot-test the .ova (ova/test-ova.sh)
        run: |
          set -euo pipefail
          cd "$W/course/ova"
          sudo ./test-ova.sh 2>&1 | tee "$W/test-ova.log"
          sudo rm -rf test

      - name: Pieces, checksum and assemble scripts
        id: pieces
        run: |
          set -euo pipefail
          OVA="$W/course/ova/out/pmity-lab.ova"
          want=$(sha256sum "$W/course/deliver/pmity-starter-00-meetup.html" | cut -d' ' -f1)
          have=$(cut -d' ' -f1 "$W/course/ova/out/embedded-page.sha256")
          [ "$want" = "$have" ] || { echo "::error::the .ova carries a different course page than this commit's"; exit 1; }
          P="$W/parts"; rm -rf "$P"; mkdir -p "$P"
          split -b 350M -d -a 1 "$OVA" "$P/pmity-lab.ova.part"
          (cd "$(dirname "$OVA")" && sha256sum pmity-lab.ova) > "$P/pmity-lab.ova.sha256"
          (cd "$W/course/course" && python3 assemble/make.py "$P" "$OVA")
          ls -l "$P"
          sha=$(cut -d' ' -f1 "$P/pmity-lab.ova.sha256")
          {
            echo "sha256=$sha"
            echo "tag=starter-vm-${sha:0:12}"
            echo "pieces=$(find "$P" -name "pmity-lab.ova.part*" | wc -l)"
            echo "size=$(awk -v b="$(stat -c %s "$OVA")" 'BEGIN{printf "%.1f GB", b/1e9}')"
          } >> "$GITHUB_OUTPUT"
          # The instructor guide names the number of pieces and the size; a different build may differ (reported, not fatal).
          (cd "$W/course/course" && python3 -c "import instructor;print(instructor.OVA_PARTS, instructor.OVA_SIZE)") > "$W/guide.txt" || echo "? ?" > "$W/guide.txt"

      - name: Check the pieces the way a student would (pmity-assemble-vm.sh in a fresh folder)
        run: |
          set -euo pipefail
          S="$W/student"; rm -rf "$S"; mkdir -p "$S"
          cp "$W/parts"/* "$S/"
          (cd "$S" && bash pmity-assemble-vm.sh)
          (cd "$S" && sha256sum -c pmity-lab.ova.sha256)
          rm -rf "$S"

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pieces.outputs.tag }}
          SHA256: ${{ steps.pieces.outputs.sha256 }}
          PIECES: ${{ steps.pieces.outputs.pieces }}
          SIZE: ${{ steps.pieces.outputs.size }}
          COURSE_SHA: ${{ steps.course.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          read -r guide_parts guide_size < "$W/guide.txt"
          note=""
          if [ "$guide_parts $guide_size" != "$PIECES $SIZE" ]; then
            note="Note for the course: the instructor guide says $guide_parts pieces, $guide_size; this image is $PIECES pieces, $SIZE."
          fi
          checks=$(grep -cE '^(OK|PASS)' "$W/test-ova.log" || true)
          cat > "$W/notes.md" <<EOF
          Class VM for the PMITY Starter one-day course (pmity-starter-00-meetup), Ubuntu 24.04 LTS Desktop, x86-64.

          **Download every file below into one folder**, then run \`pmity-assemble-vm.bat\` (Windows) or \`bash pmity-assemble-vm.sh\` (Linux, Intel Mac). It checks each piece, joins them into \`pmity-lab.ova\` and checks the result. Then import \`pmity-lab.ova\` into VirtualBox.

          - Size: $SIZE in $PIECES pieces
          - SHA-256 of pmity-lab.ova: \`$SHA256\`
          - Built from course commit ${COURSE_SHA:0:7}; boot test passed ($checks checks)
          ${note}
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Class VM ${TAG#starter-vm-} ($SIZE)" \
            --notes-file "$W/notes.md" --latest "$W/parts"/*
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
